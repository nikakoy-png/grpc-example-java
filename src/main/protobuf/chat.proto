syntax = "proto3";

package chat;

option java_multiple_files = true;
option java_package = "de.saschaufer.grpc_example.proto.chat";

service ChatService {
  rpc Chat(stream ChatMessage) returns (stream ChatEvent);
}

message ChatMessage {
  string user = 1;
  string text = 2;
}

message ChatEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    MESSAGE = 1;
    SYSTEM = 2;
  }

  Type type = 1;
  string user = 2;
  string text = 3;
  int64 ts_epoch_millis = 4;
}
